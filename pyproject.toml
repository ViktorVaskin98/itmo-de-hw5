[project]
name = "hhlake"
version = "0.3.0"
description = "ДЗ 5: расчёт навыков C/C++ из ДЗ 3 как задания Kubernetes — пределы ресурсов, хранилище в кластере, параллельные задачи по сплитам"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "duckdb>=1.1",
    "pyarrow>=17",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]
report = [
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hhlake"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["report"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
