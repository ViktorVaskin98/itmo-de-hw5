apiVersion: batch/v1
kind: Job
metadata:
  name: ${NAME}
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: hhlake
    hw5/run: ${NAME}
    hw5/stage: verify
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhlake
        hw5/run: ${NAME}
        hw5/stage: verify
    spec:
      restartPolicy: Never
      priorityClassName: ${PRIORITY}
      nodeSelector:
        hw5/pool: batch
      containers:
        - name: verify
          image: hw5-hhlake:0.3.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - hhlake.verify
            - --a
            - ${PREFIX}
            - --b
            - results/hw3/mapreduce
            - --top
            - "10"
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.hw5.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 512Mi
