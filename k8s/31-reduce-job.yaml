apiVersion: batch/v1
kind: Job
metadata:
  name: ${RUN}-reduce
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: hhlake
    hw5/run: ${RUN}
    hw5/stage: reduce
spec:
  completionMode: Indexed
  completions: ${REDUCERS}
  parallelism: ${REDUCERS}
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailIndex
        onExitCodes:
          containerName: reduce
          operator: In
          values: [137]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhlake
        hw5/run: ${RUN}
        hw5/stage: reduce
    spec:
      restartPolicy: Never
      priorityClassName: ${PRIORITY}
      nodeSelector:
        hw5/pool: batch
      containers:
        - name: reduce
          image: hw5-hhlake:0.3.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - hhlake.kube.memwatch
            - --report-every
            - "5"
            - --
            - python
            - -m
            - hhlake.kube.reducetask
            - --run
            - ${RUN}
            - --chunk-mb
            - "${CHUNK_MB}"
            - --reducers
            - "${REDUCERS}"
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.hw5.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: "${REDUCE_CPU}"
              memory: ${REDUCE_MEMORY}
            limits:
              cpu: "${REDUCE_CPU}"
              memory: ${REDUCE_MEMORY}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
