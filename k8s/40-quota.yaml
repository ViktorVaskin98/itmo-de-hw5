apiVersion: v1
kind: Namespace
metadata:
  name: hw5-quota
  labels:
    app.kubernetes.io/part-of: hhlake
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: hw5-quota
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: labadmin
  AWS_SECRET_ACCESS_KEY: labsecret123
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hw5-quota
  namespace: hw5-quota
spec:
  hard:
    requests.cpu: "3"
    limits.cpu: "3"
    requests.memory: 1Gi
    limits.memory: 1Gi
    pods: "10"
    count/jobs.batch: "4"
