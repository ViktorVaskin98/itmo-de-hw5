apiVersion: batch/v1
kind: Job
metadata:
  name: s3-migrate
  namespace: hw5
  labels:
    app.kubernetes.io/name: hhlake
    hw5/stage: migrate
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhlake
        hw5/stage: migrate
    spec:
      restartPolicy: Never
      nodeSelector:
        hw5/pool: batch
      containers:
        - name: migrate
          image: hw5-hhlake:0.3.0
          imagePullPolicy: Never
          command: [python, -m, hhlake.kube.migrate]
          env:
            - name: S3_ENDPOINT
              value: http://rustfs:9000
            - name: SOURCE_S3_ENDPOINT
              value: http://rustfs-lab:9000
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
