apiVersion: v1
kind: Service
metadata:
  name: rustfs
  namespace: hw5
  labels:
    app.kubernetes.io/name: rustfs
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      nodePort: 30900
    - name: console
      port: 9001
      targetPort: console
      nodePort: 30901
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs
  namespace: hw5
  labels:
    app.kubernetes.io/name: rustfs
spec:
  serviceName: rustfs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
    spec:
      enableServiceLinks: false
      priorityClassName: storage-critical
      nodeSelector:
        hw5/pool: storage
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
          imagePullPolicy: IfNotPresent
          env:
            - name: RUSTFS_VOLUMES
              value: /data/disk{1...8}
            - name: RUSTFS_UNSAFE_BYPASS_DISK_CHECK
              value: "true"
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: disk1
              mountPath: /data/disk1
            - name: disk2
              mountPath: /data/disk2
            - name: disk3
              mountPath: /data/disk3
            - name: disk4
              mountPath: /data/disk4
            - name: disk5
              mountPath: /data/disk5
            - name: disk6
              mountPath: /data/disk6
            - name: disk7
              mountPath: /data/disk7
            - name: disk8
              mountPath: /data/disk8
  volumeClaimTemplates:
    - metadata:
        name: disk1
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk2
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk3
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk4
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk5
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk6
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk7
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
    - metadata:
        name: disk8
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
