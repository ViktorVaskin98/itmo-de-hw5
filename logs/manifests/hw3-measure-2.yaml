apiVersion: batch/v1
kind: Job
metadata:
  name: hw3-measure-2
  namespace: hw5
  labels:
    app.kubernetes.io/name: hhlake
    hw5/run: hw3-measure-2
    hw5/stage: hw3-job
spec:
  backoffLimit: 2
  podFailurePolicy:
    rules:
      - action: FailJob
        onExitCodes:
          containerName: mapreduce
          operator: In
          values: [137]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhlake
        hw5/run: hw3-measure-2
        hw5/stage: hw3-job
    spec:
      restartPolicy: Never
      priorityClassName: batch-low
      nodeSelector:
        hw5/pool: batch
      containers:
        - name: mapreduce
          image: hw5-hhlake:0.3.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - hhlake.kube.memwatch
            - --report-every
            - "0.5"
            - --
            - python
            - -m
            - hhlake.mapreduce
            - --workers
            - "8"
            - --workdir
            - /work
            - --output
            - results/k8s/hw3-measure-2
          env:
            - name: S3_ENDPOINT
              value: http://rustfs-lab:9000
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
