apiVersion: batch/v1
kind: Job
metadata:
  name: cpu-reduce
  namespace: hw5
  labels:
    app.kubernetes.io/name: hhlake
    hw5/run: cpu
    hw5/stage: reduce
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
      - action: FailIndex
        onExitCodes:
          containerName: reduce
          operator: In
          values: [137]
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hhlake
        hw5/run: cpu
        hw5/stage: reduce
    spec:
      restartPolicy: Never
      priorityClassName: batch-low
      nodeSelector:
        hw5/pool: batch
      containers:
        - name: reduce
          image: hw5-hhlake:0.3.0
          imagePullPolicy: Never
          command:
            - python
            - -m
            - hhlake.kube.memwatch
            - --report-every
            - "5"
            - --
            - python
            - -m
            - hhlake.kube.reducetask
            - --run
            - cpu
            - --chunk-mb
            - "32"
            - --reducers
            - "4"
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.hw5.svc.cluster.local:9000
          envFrom:
            - secretRef:
                name: s3-credentials
          resources:
            requests:
              cpu: "1"
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 128Mi
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
