kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hw5
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    labels:
      hw5/pool: storage
    extraPortMappings:
      - containerPort: 30900
        hostPort: 9100
        listenAddress: "127.0.0.1"
      - containerPort: 30901
        hostPort: 9101
        listenAddress: "127.0.0.1"
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "hw5/pool=batch"
            system-reserved: "cpu=8,memory=5Gi"
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "hw5/pool=batch"
            system-reserved: "cpu=8,memory=5Gi"
